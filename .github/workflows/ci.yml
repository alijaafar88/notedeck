name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty unless the repository has signing secrets, so forks and pull requests still build (unsigned).
      NOTEDECK_KEYSTORE_BASE64: ${{ secrets.NOTEDECK_KEYSTORE_BASE64 }}
      # Only whether the secret exists; the key itself is given to the one step that needs it.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and its dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      # Local tests: plain JVM and Robolectric (Room, Compose UI flows, workers). No emulator needed.
      # assembleRelease runs R8, so a missing keep rule fails here rather than on a phone.
      - name: Test and build
        run: ./gradlew test assembleDebug assembleRelease

      # The golden set against the stored reference replies: free, repeatable, and it fails the build below the
      # gate (90%, and every injection case).
      - name: Evals (stored replies)
        run: ./gradlew :evals:run

      # The same golden set against the real model, only when the repository has an API key secret.
      - name: Evals (live model)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./gradlew :evals:run --args=live

      - name: Signed release bundle
        if: env.NOTEDECK_KEYSTORE_BASE64 != ''
        env:
          NOTEDECK_KEYSTORE_PASSWORD: ${{ secrets.NOTEDECK_KEYSTORE_PASSWORD }}
          NOTEDECK_KEY_ALIAS: ${{ secrets.NOTEDECK_KEY_ALIAS }}
          NOTEDECK_KEY_PASSWORD: ${{ secrets.NOTEDECK_KEY_PASSWORD }}
        run: |
          echo "$NOTEDECK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          NOTEDECK_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
