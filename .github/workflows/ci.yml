name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and its dependencies between runs.
      - uses: gradle/actions/setup-gradle@v6

      # Local tests: plain JVM and Robolectric (Room, Compose UI flows, workers). No emulator needed.
      - name: Test and build
        run: ./gradlew test assembleDebug

      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"
