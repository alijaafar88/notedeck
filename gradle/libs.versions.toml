composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.1"
material3Adaptive = "1.3.0"
kotlinxSerialization = "1.12.0"
ksp = "2.3.13"
hilt = "2.60.1"
androidxHilt = "1.4.0"
robolectric = "4.17"
room = "3.0.3"
sqlite = "2.7.1"
datastore = "1.3.0"
